<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Listagem</title>
</head>
<body>
  <h1>Listagem de Dados</h1>

  <h2>Alunos</h2>
  <ul id="listaAlunos"></ul>
  
  <h2>Disciplinas</h2>
  <ul id="listaDisciplinas"></ul>
  
  <h2>Matrículas</h2>
  <ul id="listaMatriculas"></ul>

  <p><a href="cadastro.html">Voltar para cadastro</a></p>

  <script>

    const dados = JSON.parse(localStorage.getItem("dados")) || { alunos: [], disciplinas: [], matriculas: []};
	
    // Listar alunos
    const ulAlunos = document.getElementById("listaAlunos");
    dados.alunos.forEach(a => {
      let li = document.createElement("li");
      li.textContent = `${a.id} - ${a.nome} (${a.curso})`;
      ulAlunos.appendChild(li);
    });
	
	// Listar disciplinas
    const ulDisciplinas = document.getElementById("listaDisciplinas");
    dados.disciplinas.forEach(d => {
      let li = document.createElement("li");
      li.textContent = `${d.id} - ${d.nome} (${d.carga}h)`;
      ulDisciplinas.appendChild(li);
    });
	
	// Listar matrículas
    const ulMatriculas = document.getElementById("listaMatriculas");
    dados.matriculas.forEach(m => {
      const aluno = dados.alunos.find(a => a.id === m.alunoId);
      const disciplina = dados.disciplinas.find(d => d.id === m.disciplinaId);
      let li = document.createElement("li");
      li.textContent = `${aluno.nome} matriculado em ${disciplina.nome}`;
      ulMatriculas.appendChild(li);
    });

    
  </script>
</body>
</html>

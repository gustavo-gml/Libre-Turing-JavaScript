<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Listagem</title>
  <link rel="stylesheet" href="../styles/style-global.css">
  <link rel="stylesheet" href="../styles/style-consultas.css">
</head>
<body>
  <h1>Empréstimos Efetuados</h1>

  <form id = "form-busca-emprestimos" class="form-busca-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 2a8 8 0 1 0 5.657 13.657l5.385 5.385 1.414-1.414-5.385-5.385A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12A6 6 0 0 1 10 4Z"></path>
      </svg>
      <input id = "texto-form-emprestimo" type="text" placeholder="Buscar por nome do aluno...">
  </form>
  
  <div class="container-tabela">
  <table >
    <thead id = "teste2">
      <th>Id</th>
      <th>aluno</th>
      <th>livro</th>
      <th>Código de Barras</th>
      <th>Data do Empréstimo</th>
      <th>Data de Devolução Prevista</th>
      <th>status</th>
      <th>Excluir</th>
    </thead>
    <tbody id ="lista-emprestimos">
      
    </tbody>
    
  </table>
  </div>
  <div class = "container-consulta">
    <a class="link-consulta" href="../pages/menu.html">Voltar Para o Menu</a>
    </div>
  
  <script>
    function salvarNoStorage(objeto) {
    localStorage.setItem("dados", JSON.stringify(objeto));
    }

    function carregarDoStorage() {
      return JSON.parse(localStorage.getItem("dados")) || { emprestimos: [] };
    }


    const dados = JSON.parse(localStorage.getItem("dados")) || { emprestimos: []};

    const tableEmprestimos = document.getElementById("lista-emprestimos");

    
    //Atualiza a lista conforme o que é digitado no campo de busca
    const campoBusca = document.getElementById("texto-form-emprestimo");

    campoBusca.addEventListener("input", function (e) {

      const texto = campoBusca.value.toLowerCase();
      const linhas = document.querySelectorAll("#lista-emprestimos tr");

      linhas.forEach(tr => {
        const colunaTitulo = tr.querySelectorAll("td")[1]; // segunda coluna

        if (!colunaTitulo) return;

        const titulo = colunaTitulo.textContent.toLowerCase();

        if (titulo.includes(texto)) {
            tr.style.display = "";
        } else {
            tr.style.display = "none";
        }
      });
    });


    //Bloqueia o envio de formulário
    const envioForm = document.getElementById("form-busca-emprestimos")

    envioForm.addEventListener("submit", function(e){

      e.preventDefault()
    })


    dados.emprestimos.forEach(a => {

      let tr =document.createElement("tr");
      
      
      let tdId = document.createElement("td");
      let tdAluno = document.createElement("td");
      let tdLivro = document.createElement("td");
      let tdCodigo = document.createElement("td");
      let tdDataEmprestimo = document.createElement("td");
      let tdDataEsperada = document.createElement("td");
      let tdStatus = document.createElement("td");
      let tdExcluir = document.createElement("td");
      
      tdId.textContent = a.id;
      tdAluno.textContent = a.aluno.nome;
      tdLivro.textContent = a.livro.nome;
      tdCodigo.textContent = a.livro.codigoBarras;
      tdDataEmprestimo.textContent = a.dataEmprestimo;
      tdDataEsperada.textContent = a.dataDevolucaoPrevista;
      tdStatus.textContent = a.status;
      
      


      
      // ———————– Excluir ———————–
      const btnExcluir = document.createElement("button");
      btnExcluir.textContent = "Excluir";
      btnExcluir.addEventListener("click", () => excluir(a.id));
      tdExcluir.appendChild(btnExcluir);

      
      tr.appendChild(tdId);
      tr.appendChild(tdAluno);
      tr.appendChild(tdLivro);
      tr.appendChild(tdCodigo);
      tr.appendChild(tdDataEmprestimo );
      tr.appendChild(tdDataEsperada);
      tr.appendChild(tdStatus);
      tr.appendChild(tdExcluir);

      tableEmprestimos.appendChild(tr);

      

    });

  


      function excluir(id){
        if (!confirm("Deseja realmente excluir este empréstimo?")) return;
        const dados = carregarDoStorage();
        dados.emprestimos = dados.emprestimos.filter(l => l.id !== id);
        salvarNoStorage(dados);
        location.reload();
    }
      
  </script>

</body>
</html>

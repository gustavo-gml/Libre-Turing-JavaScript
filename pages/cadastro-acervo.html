<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Livro - Libre Turing</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="container">
    <a href="cadastro-livro.html" class="back-link">← Voltar</a>
    <section id="cadastro-livro">
      <h2>Cadastro de Livro</h2>
      <p>Adicione um novo livro ao acervo da biblioteca.</p>
      <form class="form-login">

        <label for="select-livro">Nome do Livro:</label>
        <select id="select-livro"></select>

        <label for="select-isbn">ISBN do Livro:</label>
        <select id="select-isbn"></select>

        <label for="cadastro-codigo-livro">Código de Barras do Livro:</label>
        <input type="text" id="cadastro-codigo-livro" name="cadastro-codigo-livro"
          placeholder="Informe o código de barras do livro" required>

        <label for="cadastro-data-livro">Data de aquisição do Livro:</label>
        <input type="date" id="cadastro-data-livro" name="cadastro-data-livro" required>

        <button type="submit">Cadastrar Livro</button>

      </form>
    </section>
  </div>

  <script>
    function salvarNoStorage(objeto) {
      localStorage.setItem("dados", JSON.stringify(objeto));
    }

    function carregarDoStorage() {
      return JSON.parse(localStorage.getItem("dados")) || { livros: [], acervo: [] };
    }

    function atualizarSelects() {
      const dados = carregarDoStorage();
      const selectlivro = document.getElementById("select-livro");
      const selectisbn = document.getElementById("select-isbn");

      selectlivro.innerHTML = "";
      selectisbn.innerHTML = "";

      dados.livros.forEach(l => {
        let opt1 = document.createElement("option");
        opt1.value = l.id;
        opt1.textContent = l.nome;
        selectlivro.appendChild(opt1);

        let opt2 = document.createElement("option");
        opt2.value = l.isbn;
        opt2.textContent = l.isbn;
        selectisbn.appendChild(opt2);
      });
    }

    atualizarSelects();
  </script>
</body>

</html>
